# Ktor's YAML loader wants "$VAR:default", NOT the HOCON ${VAR:default}
# form. With braces it dies at startup on
#   NoSuchElementException: Char sequence is empty
# before a single line of application code runs.
ktor:
  deployment:
    port: "$PORT:8080"
    host: 0.0.0.0
  application:
    modules:
      - com.freeapp.founderrooms.ApplicationKt.module

database:
  url: "$DATABASE_URL:jdbc:postgresql://localhost:5432/app"
  user: "$DATABASE_USER:app"
  password: "$DATABASE_PASSWORD:app"
  maxPoolSize: "$DATABASE_MAX_POOL_SIZE:10"

jwt:
  secret: "$JWT_SECRET:dev-secret-change-me-in-deploy"
